<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif">
<defs>
  <filter id="bS" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <filter id="bM" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="bL" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>

  <linearGradient id="gHeart" gradientUnits="userSpaceOnUse" x1="101" y1="144" x2="219" y2="248"><stop offset="0" stop-color="#928FFA"/><stop offset=".5" stop-color="#6A5FE0"/><stop offset="1" stop-color="#4A39BC"/></linearGradient>
  <linearGradient id="gCH" gradientUnits="userSpaceOnUse" x1="134" y1="164" x2="186" y2="216"><stop offset="0" stop-color="#ECFF8A"/><stop offset="1" stop-color="#A6D42B"/></linearGradient>
  <linearGradient id="gInd" gradientUnits="userSpaceOnUse" x1="402" y1="128" x2="498" y2="200"><stop offset="0" stop-color="#8E8CF9"/><stop offset="1" stop-color="#544ED2"/></linearGradient>
  <linearGradient id="gLimeB" gradientUnits="userSpaceOnUse" x1="402" y1="196" x2="498" y2="262"><stop offset="0" stop-color="#D6F45C"/><stop offset="1" stop-color="#A6D42B"/></linearGradient>
  <linearGradient id="gMort" gradientUnits="userSpaceOnUse" x1="686" y1="196" x2="794" y2="262"><stop offset="0" stop-color="#8E8CF9"/><stop offset=".5" stop-color="#6A5FE0"/><stop offset="1" stop-color="#4A39BC"/></linearGradient>
  <linearGradient id="gPest" gradientUnits="userSpaceOnUse" x1="724" y1="138" x2="758" y2="220"><stop offset="0" stop-color="#8E8CF9"/><stop offset="1" stop-color="#5B54D6"/></linearGradient>
  <radialGradient id="gKnob" cx=".38" cy=".34" r=".8"><stop offset="0" stop-color="#F1FFA8"/><stop offset="1" stop-color="#A6D42B"/></radialGradient>

  <path id="hp" d="M12 20.5C5.5 15 2.2 11.4 2.2 7.8 2.2 5.1 4.4 3.2 7 3.2 8.9 3.2 10.6 4.2 12 6 13.4 4.2 15.1 3.2 17 3.2 19.6 3.2 21.8 5.1 21.8 7.8 21.8 11.4 18.5 15 12 20.5Z"/>
  <clipPath id="clH"><use href="#hp" transform="translate(87.8,124.7) scale(6.02)"/></clipPath>
  <clipPath id="clB"><rect x="402" y="128" width="96" height="132" rx="48"/></clipPath>
  <clipPath id="clM"><path d="M686,206 L794,206 L781,246 Q775,261 758,261 L722,261 Q705,261 699,246 Z"/></clipPath>
</defs>

<rect x="6" y="6" width="888" height="448" rx="22" fill="#F7F6FC" stroke="#E7E4F3"/>
<text x="34" y="40" font-size="19" font-weight="800" fill="#201F38">Pharma — warmer, more ownable directions</text>

<!-- ===== Heart-Cross ===== -->
<ellipse cx="160" cy="276" rx="70" ry="15" fill="#241F4A" opacity="0.22" filter="url(#bL)"/>
<use href="#hp" transform="translate(87.8,124.7) scale(6.02)" fill="url(#gHeart)"/>
<g clip-path="url(#clH)">
  <ellipse cx="130" cy="176" rx="52" ry="36" fill="#ffffff" opacity="0.42" filter="url(#bM)"/>
  <ellipse cx="196" cy="228" rx="48" ry="34" fill="#2E2498" opacity="0.40" filter="url(#bM)"/>
  <ellipse cx="134" cy="170" rx="13" ry="7" fill="#ffffff" opacity="0.9" filter="url(#bS)"/>
</g>
<g>
  <rect x="151" y="164" width="18" height="52" rx="9" fill="url(#gCH)"/>
  <rect x="134" y="181" width="52" height="18" rx="9" fill="url(#gCH)"/>
  <ellipse cx="150" cy="177" rx="12" ry="7" fill="#ffffff" opacity="0.45" filter="url(#bS)"/>
</g>
<text x="160" y="356" text-anchor="middle" font-size="16" font-weight="800" fill="#201F38">Heart-Cross</text>
<text x="160" y="378" text-anchor="middle" font-size="12.5" fill="#7A759B">care, built in</text>

<!-- ===== Mascot ===== -->
<ellipse cx="450" cy="284" rx="66" ry="15" fill="#241F4A" opacity="0.24" filter="url(#bL)"/>
<!-- arms behind body -->
<g transform="rotate(18 402 206)"><rect x="368" y="199" width="36" height="15" rx="7.5" fill="url(#gInd)"/></g>
<g transform="rotate(-34 498 182)"><rect x="490" y="146" width="15" height="38" rx="7.5" fill="url(#gLimeB)"/></g>
<!-- body two-tone -->
<g clip-path="url(#clB)">
  <rect x="402" y="128" width="96" height="70" fill="url(#gInd)"/>
  <rect x="402" y="196" width="96" height="66" fill="url(#gLimeB)"/>
  <line x1="402" y1="196" x2="498" y2="196" stroke="#4a41b8" stroke-width="2.5" opacity="0.4"/>
  <ellipse cx="432" cy="158" rx="44" ry="40" fill="#ffffff" opacity="0.34" filter="url(#bM)"/>
  <ellipse cx="482" cy="236" rx="40" ry="34" fill="#5f7d12" opacity="0.32" filter="url(#bM)"/>
  <ellipse cx="432" cy="150" rx="14" ry="8" fill="#ffffff" opacity="0.9" filter="url(#bS)"/>
</g>
<!-- feet -->
<ellipse cx="430" cy="262" rx="12" ry="7" fill="#9fca2c"/>
<ellipse cx="470" cy="262" rx="12" ry="7" fill="#9fca2c"/>
<!-- face -->
<ellipse cx="419" cy="184" rx="8" ry="5" fill="#FF9BB0" opacity="0.5"/>
<ellipse cx="481" cy="184" rx="8" ry="5" fill="#FF9BB0" opacity="0.5"/>
<ellipse cx="433" cy="167" rx="12" ry="15" fill="#ffffff"/>
<ellipse cx="469" cy="167" rx="12" ry="15" fill="#ffffff"/>
<ellipse cx="436" cy="170" rx="6" ry="7.5" fill="#201F38"/>
<ellipse cx="472" cy="170" rx="6" ry="7.5" fill="#201F38"/>
<circle cx="433.5" cy="164" r="2.6" fill="#ffffff"/>
<circle cx="469.5" cy="164" r="2.6" fill="#ffffff"/>
<path d="M432,187 Q450,201 468,187" stroke="#201F38" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="388" y="70" width="130" height="26" rx="13" fill="#201F38"/>
<text x="453" y="87" text-anchor="middle" font-size="11.5" font-weight="700" fill="#D8F55A">★ MOST MEMORABLE</text>
<text x="450" y="356" text-anchor="middle" font-size="16" font-weight="800" fill="#201F38">The Mascot “Habboub”</text>
<text x="450" y="378" text-anchor="middle" font-size="12.5" fill="#7A759B">a face people remember</text>

<!-- ===== Mortar & Pestle ===== -->
<ellipse cx="740" cy="278" rx="80" ry="16" fill="#241F4A" opacity="0.24" filter="url(#bL)"/>
<g transform="rotate(20 740 205)">
  <rect x="731" y="138" width="18" height="84" rx="9" fill="url(#gPest)"/>
  <circle cx="740" cy="141" r="14" fill="url(#gKnob)"/>
  <ellipse cx="736" cy="137" rx="5" ry="3" fill="#ffffff" opacity="0.8" filter="url(#bS)"/>
</g>
<path d="M686,206 L794,206 L781,246 Q775,261 758,261 L722,261 Q705,261 699,246 Z" fill="url(#gMort)"/>
<ellipse cx="740" cy="206" rx="54" ry="13" fill="#A6A3FB"/>
<ellipse cx="740" cy="207" rx="40" ry="9" fill="#453CB0"/>
<g clip-path="url(#clM)">
  <ellipse cx="712" cy="224" rx="36" ry="18" fill="#ffffff" opacity="0.30" filter="url(#bM)"/>
  <ellipse cx="772" cy="248" rx="30" ry="16" fill="#2E2498" opacity="0.40" filter="url(#bM)"/>
</g>
<text x="740" y="356" text-anchor="middle" font-size="16" font-weight="800" fill="#201F38">Mortar &amp; Pestle</text>
<text x="740" y="378" text-anchor="middle" font-size="12.5" fill="#7A759B">timeless apothecary</text>
</svg>
