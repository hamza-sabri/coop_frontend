name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast gate: types, unit tests, production build. Runs on every push.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        # The app builds with ignoreBuildErrors, so this is the real gate.
        run: pnpm exec tsc --noEmit
        continue-on-error: true # TODO: flip to false once the known baseline is cleared
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_PHARMACY_SLUG: demo

  # Money-path E2E against a REAL local stack (Django + seeded SQLite + the app).
  # Needs read access to the backend repo: add a BACKEND_REPO_TOKEN secret.
  e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: hamza-sabri/Alrahmah
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: alrahmah
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend deps
        run: |
          if [ -d alrahmah ]; then
            python -m venv alrahmah/.venv
            alrahmah/.venv/bin/pip install -q -r alrahmah/requirements.txt
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E (money paths + smoke)
        if: ${{ hashFiles('alrahmah/manage.py') != '' }}
        working-directory: frontend
        env:
          BACKEND_DIR: ${{ github.workspace }}/alrahmah
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
